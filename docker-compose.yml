services:
  mongodb:
    image: mongo:7.0
    container_name: energyflow_mongodb
    restart: unless-stopped
    stop_grace_period: 15s
    env_file:
      - path: .env
        required: false
    environment:
      DB_NAME: ${DB_NAME:-energy_flow_germany}
      MONGO_COLLECTION_ELECTRICITY_PRICES: ${MONGO_COLLECTION_ELECTRICITY_PRICES:-electricity_prices}
      MONGO_COLLECTION_WEATHER_FORECASTS: ${MONGO_COLLECTION_WEATHER_FORECASTS:-weather_forecasts}
      MONGO_COLLECTION_CHECKPOINTS: ${MONGO_COLLECTION_CHECKPOINTS:-ingestion_checkpoints}
      MONGO_COLLECTION_DLQ: ${MONGO_COLLECTION_DLQ:-dead_letter_records}
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
      - ./docker/mongodb/init-collections.js:/docker-entrypoint-initdb.d/01-init-collections.js:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep -q 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - energyflow_net

  ingestion:
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    container_name: energyflow_ingestion
    restart: unless-stopped
    stop_grace_period: 15s
    env_file:
      - path: .env
        required: false
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mongodb:27017/}
      DB_NAME: ${DB_NAME:-energy_flow_germany}
      ENERGY_CHARTS_BASE_URL: ${ENERGY_CHARTS_BASE_URL:-https://api.energy-charts.info}
      ENERGY_CHARTS_BIDDING_ZONE: ${ENERGY_CHARTS_BIDDING_ZONE:-DE-LU}
      OPEN_METEO_BASE_URL: ${OPEN_METEO_BASE_URL:-https://api.open-meteo.com/v1/forecast}
      WEATHER_LATITUDE: ${WEATHER_LATITUDE:-51.2277}
      WEATHER_LONGITUDE: ${WEATHER_LONGITUDE:-6.7735}
      WEATHER_TIMEZONE: ${WEATHER_TIMEZONE:-Europe/Berlin}
      ENERGY_POLL_INTERVAL_SECONDS: ${ENERGY_POLL_INTERVAL_SECONDS:-900}
      WEATHER_POLL_INTERVAL_SECONDS: ${WEATHER_POLL_INTERVAL_SECONDS:-3600}
      HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS:-20}
      INGESTION_RUN_ONCE: ${INGESTION_RUN_ONCE:-false}
    command: ["python", "-m", "ingestion.runner"]
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - energyflow_net

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: energyflow_api
    restart: unless-stopped
    stop_grace_period: 15s
    env_file:
      - path: .env
        required: false
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mongodb:27017/}
      DB_NAME: ${DB_NAME:-energy_flow_germany}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - energyflow_net

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: energyflow_dashboard
    restart: unless-stopped
    stop_grace_period: 15s
    env_file:
      - path: .env
        required: false
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://api:8000}
      DASHBOARD_PORT: ${DASHBOARD_PORT:-8501}
      HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS:-20}
    command:
      [
        "streamlit",
        "run",
        "dashboard/app.py",
        "--server.port=8501",
        "--server.address=0.0.0.0"
      ]
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=4)"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - energyflow_net

volumes:
  mongodb_data:
    name: energyflow_mongodb_data

networks:
  energyflow_net:
    name: energyflow_internal_net
    driver: bridge
